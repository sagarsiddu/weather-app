server.port=8084
spring.application.name=WeatherForecast

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Database connection properties (already in your file)
spring.datasource.url=jdbc:postgresql://localhost:5432/weatherdb
spring.datasource.username=postgres
spring.datasource.password=password

# OpenWeatherMap API Configuration
weather.api.key=dd37de248a05d00ce3188cc7776c6975
weather.api.url=https://api.openweathermap.org/data/2.5/weather
weather.api.units=metric

logging.level.org.springframework.web=INFO
logging.level.com.WeatherForecast=DEBUG