server.port=8084
spring.application.name=WeatherForecast

# GitHub OAuth2 login
spring.security.oauth2.client.registration.github.client-id= Ov23limgXT5hboQzxpHI
spring.security.oauth2.client.registration.github.client-secret= 4f20be4da94d63a772742995a12f70eb264143a0
spring.security.oauth2.client.registration.github.redirect-uri= http://localhost:8084/login/oauth2/code/github
spring.security.oauth2.client.registration.github.scope=read:user

logging.level.org.springframework.security=DEBUG

# Allow cookies to be sent from frontend
server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=false

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Database connection properties (already in your file)
spring.datasource.url=jdbc:postgresql://localhost:5432/weatherdb
spring.datasource.username=postgres
spring.datasource.password=password

# OpenWeatherMap API Configuration
weather.api.key=dd37de248a05d00ce3188cc7776c6975
weather.api.url=https://api.openweathermap.org/data/2.5/weather
weather.api.units=metric

# Javers Configuration
javers.commitIdGenerator=synchronized_sequence

# Additional Javers Configuration for PostgreSQL
javers.sqlSchema=public

javers.algorithm=simple
javers.mappingStyle=field
javers.newObjectSnapshot=true
javers.prettyPrint=true
javers.sqlSchemaManagementEnabled=false
javers.spring-data.enabled=true

# Logging
logging.level.org.springframework=DEBUG
logging.level.org.javers=DEBUG
logging.level.com.example.WeatherForecast=DEBUG

logging.level.com.fasterxml.jackson.databind=DEBUG
